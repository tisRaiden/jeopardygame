<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jeopardy Maker</title>
  <link rel="stylesheet" href="jeopardy.css">
</head>

<body class="intro-on">
  <header>
    <h1 id="title"></h1>
    <div class="tb">
      <button id="bEdit">✎ Edit</button>
      <button class="edit-only" id="bTheme">🎨 Look</button>
      <span class="tc edit-only">Teams <button id="tM">−</button><b id="tN"></b><button id="tP">+</button></span>
      <button id="bExp" title="Download this game as a file">⬇ Save file</button>
      <button id="bImp" title="Open a saved game file">⬆ Load file</button>
      <input type="file" id="file" accept=".json" hidden>
      <button id="bNew" title="Re-open all clues and reset scores">↺ New round</button>
      <button class="edit-only" id="aC">+ Category</button>
      <button class="edit-only" id="rC">− Category</button>
      <button class="edit-only" id="aR">+ Row</button>
      <button class="edit-only" id="rR">− Row</button>
      <button class="edit-only" id="rDD" title="Clear all Daily Doubles and place 2 at random">🎲 Random Daily
        Doubles</button>
    </div>
  </header>
  <div id="board" class="intro"></div>
  <div id="scores"></div>

  <div id="ov" hidden>
    <div id="card">
      <div id="meta"></div>
      <div id="q"></div><img id="qimg" alt="" hidden>
      <div id="ans"></div>
      <div id="act"></div>
    </div>
  </div>

  <div id="ed" class="modal" hidden>
    <div class="panel">
      <h3 id="edH">Edit clue</h3>
      <label>Clue<textarea id="eq" rows="3"></textarea></label>
      <label>Answer<input id="ea"></label>
      <label>Image (optional)<input id="ei" type="file" accept="image/*"></label>
      <div id="eiw" style="display:none;gap:10px;align-items:center"><img id="eip" alt=""
          style="max-height:80px;border-radius:6px"><button class="btn" id="eiX" type="button">Remove image</button>
      </div>
      <div class="row"><label>Row value ($)<input id="ev" type="number"></label><label>Daily Double<select id="ed2">
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select></label></div>
      <div class="row"><button class="btn" id="edX">Cancel</button><button class="btn pri" id="edS">Save</button></div>
    </div>
  </div>

  <div id="th" class="modal" hidden>
    <div class="panel">
      <h3>Customize the look</h3>
      <label>Preset<select id="tp"></select></label>
      <div class="row"><label>Background<input type="color" data-k="bg"></label><label>Background edge<input
            type="color" data-k="bg2"></label>
        <label>Tiles<input type="color" data-k="tile"></label><label>Text<input type="color" data-k="text"></label>
        <label>Accent / values<input type="color" data-k="accent"></label>
        <label>Font<select data-k="font" id="tf"></select></label>
      </div>
      <label>Corner roundness<input type="range" min="0" max="30" data-k="radius"></label>
      <label>Tile spacing<input type="range" min="0" max="20" data-k="gap"></label>
      <button class="btn pri" id="thX">Done</button>
    </div>
  </div>

  <script>
    const $ = s => document.querySelector(s), mk = (t, c, x) => {const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e};
    const FONTS = {Impact: "Impact,'Arial Narrow',sans-serif", Georgia: "Georgia,serif", Trebuchet: "'Trebuchet MS',sans-serif", Courier: "'Courier New',monospace", Chalkboard: "'Comic Sans MS','Chalkboard SE',cursive", Verdana: "Verdana,sans-serif"};
    const P = {
      Classic: {bg: '#0a1a5c', bg2: '#050d33', tile: '#1a3fb5', text: '#ffffff', accent: '#ffcc33', font: FONTS.Impact, radius: 6, gap: 8},
      Neon: {bg: '#2a0060', bg2: '#000000', tile: '#4a0a8a', text: '#f5e9ff', accent: '#00f0ff', font: FONTS.Trebuchet, radius: 16, gap: 10},
      Sunset: {bg: '#ff7a45', bg2: '#7a1f5c', tile: '#4a1942', text: '#fff4e0', accent: '#ffd166', font: FONTS.Georgia, radius: 18, gap: 10},
      Chalkboard: {bg: '#2b5a43', bg2: '#10231a', tile: '#2d5a43', text: '#f4f1e6', accent: '#f2d16b', font: FONTS.Chalkboard, radius: 4, gap: 6},
      Paper: {bg: '#f2ead8', bg2: '#d9cdb0', tile: '#fffaf0', text: '#2a2118', accent: '#b3341b', font: FONTS.Georgia, radius: 2, gap: 8}
    };
    const cl = (q, a, dd) => ({q: q || 'ADD QUESTION', a: a || 'ADD ANSWER', dd: !!dd});
    function def() {
      return {
        title: 'JEOPARDY!', theme: {...P.Classic}, values: [200, 400, 600, 800, 1000], turn: 0, used: {},
        cats: [1, 2, 3, 4, 5].map(n => ({name: 'CAT ' + n, clues: [0, 1, 2, 3, 4].map(() => cl())})),
        teams: [{name: 'Team 1', score: 0, color: '#ff7b7b'}, {name: 'Team 2', score: 0, color: '#7bd0ff'}, {name: 'Team 3', score: 0, color: '#8dff7b'}]
      }
    }
    const OLDQ = ['This planet is known as the Red Planet', 'Ancient wonder in Egypt built as a tomb', 'Hitchcock thriller set in a shower', 'Longest river in Africa', 'Italian dish of flat dough, tomato and cheese'];
    const OLDC = ['Science', 'History', 'Movies', 'Geography', 'Food'];
    function fix(d) {try {d.cats.forEach((c, i) => {if (c.name === OLDC[i] || c.name === 'New category') c.name = 'CAT ' + (i + 1)}); d.cats.forEach(c => c.clues.forEach(k => {const blank = !k.q && !k.a; if (blank || OLDQ.includes(k.q)) {k.q = 'ADD QUESTION'; k.a = 'ADD ANSWER'; if (blank) k.dd = false} else {if (!k.q) k.q = 'ADD QUESTION'; if (!k.a) k.a = 'ADD ANSWER'} }))} catch (e) { } return d}
    function load() {try {return fix(JSON.parse(localStorage.getItem('jeo-maker')))} catch (e) {return null} }
    function save() {try {localStorage.setItem('jeo-maker', JSON.stringify(S))} catch (e) {if (!window._qw) {window._qw = 1; alert('Your browser could not store the whole game (probably too many or too large images). Use Save file to keep a copy.')} } }
    let S = load() || def(), edit = false, cur = null, snd = true, AC;
    // ---------- sound
    function beep(seq, type = 'triangle') {if (!snd) return; try {AC = AC || new (window.AudioContext || window.webkitAudioContext)(); let t = AC.currentTime; seq.forEach(([f, d]) => {const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d); t += d * .8})} catch (e) { } }
    const sfx = {ok: () => beep([[523, .12], [659, .12], [784, .25]]), no: () => beep([[150, .35]], 'sawtooth'), open: () => beep([[330, .08], [440, .08]]), dd: () => beep([[392, .15], [523, .15], [659, .15], [784, .3]])};
    // ---------- theme
    function applyTheme() {const t = S.theme, r = document.documentElement.style;['bg', 'bg2', 'tile', 'text', 'accent', 'font'].forEach(k => r.setProperty('--' + k, t[k])); r.setProperty('--radius', t.radius + 'px'); r.setProperty('--gap', t.gap + 'px')}
    // ---------- board
    function board(anim) {
      const b = $('#board'); b.className = anim ? 'intro' : ''; b.style.gridTemplateColumns = `repeat(${S.cats.length},1fr)`; b.style.gridTemplateRows = `.55fr repeat(${S.values.length},1fr)`; b.innerHTML = '';
      S.cats.forEach((c, i) => {
        const h = mk('div', 'cat'); h.style.animationDelay = i * 70 + 'ms';
        if (edit) {const n = mk('input'); n.value = c.name; n.oninput = () => {c.name = n.value; save()}; h.append(n)} else h.textContent = c.name; b.append(h)
      });
      S.values.forEach((v, r) => S.cats.forEach((c, i) => {
        const t = mk('button', 'tile'); const k = i + '-' + r, used = S.used[k] && !edit;
        t.textContent = used ? '' : '$' + v + (edit && c.clues[r].dd ? ' ★' : '') + (edit && c.clues[r].img ? ' 🖼' : ''); if (used) t.classList.add('used');
        t.style.animationDelay = (i * 70 + r * 90 + 300) + 'ms'; t.onclick = () => edit ? editor(i, r) : openClue(i, r, t); b.append(t)
      }))
    }
    function scores(pop, delta) {
      const s = $('#scores'); s.innerHTML = ''; $('#tN').textContent = S.teams.length; const n = S.teams.length; s.classList.toggle('dense', n > 5); s.style.setProperty('--tw', n > 9 ? '88px' : n > 7 ? '100px' : n > 5 ? '118px' : n > 3 ? '140px' : '170px');
      S.teams.forEach((t, i) => {
        const d = mk('div', 'team' + (i == S.turn ? ' turn' : '') + (i === pop ? ' pop' : '')); d.style.setProperty('--c', t.color);
        const n = mk('div', 'nm', t.name);
        const sc = mk('b', t.score < 0 ? 'neg' : '', '$' + t.score.toLocaleString());
        d.append(n, sc); d.onclick = () => {S.turn = i; save(); scores()};
        if (edit) {const c = mk('input'); c.type = 'color'; c.value = t.color; c.onclick = e => e.stopPropagation(); c.oninput = () => {t.color = c.value; save(); d.style.setProperty('--c', c.value)}; d.append(c)}
        if (i === pop) {const f = mk('span', 'float' + (delta < 0 ? ' neg' : ''), (delta > 0 ? '+' : '−') + '$' + Math.abs(delta)); d.append(f)}
        s.append(d)
      })
    }
    function add(i, d) {S.teams[i].score += d; save(); scores(i, d)}
    // ---------- clue
    function openClue(i, r, el) {
      const k = i + '-' + r; if (S.used[k]) return; const c = S.cats[i].clues[r];
      cur = {i, r, c, k, locked: new Set(), team: S.turn, wager: 0, dd: c.dd, stage: c.dd ? 0 : 1, rev: false, done: false};
      const b = el.getBoundingClientRect(), ov = $('#ov'); ov.style.transformOrigin = (b.left + b.width / 2) + 'px ' + (b.top + b.height / 2) + 'px'; ov.classList.remove('out'); ov.hidden = false;
      c.dd ? sfx.dd() : sfx.open(); draw()
    }
    const btn = (l, f, c) => {const b = mk('button', 'btn ' + (c || ''), l); b.onclick = f; return b};
    function draw() {
      const {c, i, r} = cur, v = S.values[r], q = $('#q'), a = $('#ans'), act = $('#act'); act.innerHTML = '';
      $('#meta').textContent = S.cats[i].name + ' · $' + v;
      if (cur.stage == 0) {
        $('#qimg').hidden = true; q.className = 'dd'; q.textContent = 'Daily Double!';
        if (!S.teams[cur.team]) cur.team = 0; a.textContent = S.teams[cur.team].name + ', place your wager';
        const w = mk('input'); w.type = 'number'; w.className = 'btn'; w.value = Math.max(v, Math.min(S.teams[cur.team].score, 1000)); w.style.cssText = 'width:140px;background:#fff;color:#111;text-align:center';
        act.append(w, btn('Lock wager', () => {cur.wager = Math.max(0, +w.value || 0); cur.stage = 1; draw()})); return
      }
      q.className = ''; q.textContent = c.q || '(No clue written yet. Use Edit to add one.)'; a.textContent = cur.rev ? (c.a || '—') : '';
      const im = $('#qimg'); if (c.img) {if (im.getAttribute('src') !== c.img) im.src = c.img; im.hidden = false} else im.hidden = true;
      const amt = cur.dd ? cur.wager : v;
      if (cur.done) {act.append(btn('Close', closeClue)); return }
      if (!cur.rev) {const rv = mk('div', 'full'); rv.append(btn('Reveal answer', () => {cur.rev = true; draw()})); act.append(rv)}
      S.teams.forEach((t, n) => {
        if (cur.dd && n != cur.team) return; const lk = cur.locked.has(n);
        const y = btn('✓ ' + t.name + ' +$' + amt.toLocaleString(), () => right(n, amt), 'ok'), x = btn('✗', () => wrong(n, amt), 'no'); y.disabled = x.disabled = lk; act.append(y, x)
      });
      const no = mk('div', 'full'); no.append(btn('No one', () => finish())); act.append(no)
    }
    function finish() {cur.rev = cur.done = true; S.used[cur.k] = 1; save(); board(); draw()}
    function right(n, a) {add(n, a); S.turn = n; sfx.ok(); confetti(); finish(); scores(n, a)}
    function wrong(n, a) {
      add(n, -a); sfx.no(); cur.locked.add(n); const c = $('#card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
      if (cur.dd || cur.locked.size >= S.teams.length) finish(); else draw()
    }
    function closeClue() {if (!cur) return; const ov = $('#ov'); ov.classList.add('out'); cur = null; setTimeout(() => {ov.hidden = true}, 230)}
    function confetti() {const cs = [S.theme.accent, '#fff', '#ff6b6b', '#6bd5ff', '#8dff7b']; for (let n = 0; n < 70; n++) {const e = mk('i', 'conf'); e.style.left = Math.random() * 100 + 'vw'; e.style.background = cs[n % 5]; e.style.animationDelay = Math.random() * .5 + 's'; e.style.animationDuration = 1.8 + Math.random() * 1.5 + 's'; document.body.append(e); setTimeout(() => e.remove(), 4000)} }
    // ---------- editor
    let ei = 0, er = 0;
    function editor(i, r) {ei = i; er = r; const c = S.cats[i].clues[r]; $('#edH').textContent = S.cats[i].name + ' · row ' + (r + 1); $('#eq').value = c.q; $('#ea').value = c.a; $('#ev').value = S.values[r]; $('#ed2').value = c.dd ? 1 : 0; pendingImg = c.img || ''; showImg(); $('#ed').hidden = false; $('#eq').focus()}
    let pendingImg = '';
    function showImg() {$('#eiw').style.display = pendingImg ? 'flex' : 'none'; $('#eip').src = pendingImg}
    $('#ei').onchange = e => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return; const r = new FileReader();
      r.onload = () => {
        const im = new Image(); im.onload = () => {
          const k = Math.min(1, 900 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
          cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height); x.drawImage(im, 0, 0, cv.width, cv.height);
          pendingImg = cv.toDataURL('image/jpeg', .8); showImg()
        }; im.onerror = () => alert('That image could not be read. Please use a JPG, PNG, GIF or WebP file (iPhone HEIC photos are not supported).'); im.src = r.result
      }; r.onerror = () => alert('That file could not be opened.'); r.readAsDataURL(f)
    };
    $('#eiX').onclick = () => {pendingImg = ''; showImg()};
    $('#edX').onclick = () => $('#ed').hidden = true;
    $('#edS').onclick = () => {const c = S.cats[ei].clues[er]; c.q = $('#eq').value; c.a = $('#ea').value; c.dd = $('#ed2').value == '1'; c.img = pendingImg; S.values[er] = +$('#ev').value || S.values[er]; save(); $('#ed').hidden = true; board()};
    // ---------- structure
    const nR = () => S.values.length;
    $('#rDD').onclick = () => {
      const all = []; S.cats.forEach((c, i) => c.clues.forEach((k, r) => {k.dd = false; all.push([i, r])}));
      for (let n = 0; n < 2 && all.length; n++) {const [i, r] = all.splice(Math.floor(Math.random() * all.length), 1)[0]; S.cats[i].clues[r].dd = true} save(); board()
    };
    $('#aC').onclick = () => {if (S.cats.length >= 8) return; S.cats.push({name: 'CAT ' + (S.cats.length + 1), clues: S.values.map(() => cl())}); save(); board()};
    $('#rC').onclick = () => {if (S.cats.length > 1) {S.cats.pop(); save(); board()} };
    $('#aR').onclick = () => {if (nR() >= 8) return; S.values.push(S.values[nR() - 1] + 200); S.cats.forEach(c => c.clues.push(cl())); save(); board()};
    $('#rR').onclick = () => {if (nR() > 1) {S.values.pop(); S.cats.forEach(c => c.clues.pop()); save(); board()} };
    const COLORS = ['#ff7b7b', '#7bd0ff', '#8dff7b', '#ffd97b', '#d39bff', '#ff9be0', '#7bffe3', '#ffb07b', '#b0c4ff', '#c8ff7b', '#ff7b9c', '#9bffb0'];
    $('#tP').onclick = () => {if (S.teams.length >= 12) return; const n = S.teams.length; S.teams.push({name: 'Team ' + (n + 1), score: 0, color: COLORS[n % COLORS.length]}); save(); scores()};
    $('#tM').onclick = () => {if (S.teams.length <= 1) return; S.teams.pop(); if (S.turn >= S.teams.length) S.turn = 0; save(); scores()};
    // ---------- toolbar
    $('#bEdit').onclick = () => {edit = !edit; document.body.classList.toggle('edit', edit); $('#bEdit').textContent = edit ? '▶ Play' : '✎ Edit'; $('#title').contentEditable = edit; board(); scores()};
    $('#title').oninput = e => {S.title = e.target.textContent; save(); document.title = S.title};
    function twoClick(id, label, fn) {const b = $(id); let t; b.onclick = () => {if (b.dataset.arm) {clearTimeout(t); delete b.dataset.arm; b.textContent = label; fn()} else {b.dataset.arm = 1; b.textContent = 'Click again to confirm'; t = setTimeout(() => {delete b.dataset.arm; b.textContent = label}, 3000)} }}
    twoClick('#bNew', '↺ New round', () => {if (cur) closeClue(); S.used = {}; S.teams.forEach(t => t.score = 0); S.turn = 0; save(); board(true); scores()});
    // ---------- save / load file
    $('#bExp').onclick = () => {const a = mk('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'})); a.download = (S.title || 'jeopardy').replace(/\W+/g, '-') + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000)};
    $('#bImp').onclick = () => $('#file').click();
    $('#file').onchange = e => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return; const r = new FileReader(); r.onload = () => {
        try {
          const d = JSON.parse(r.result); if (!Array.isArray(d.cats) || !Array.isArray(d.values)) throw 0;
          const D = def(); d.title = d.title || D.title; d.theme = {...P.Classic, ...d.theme}; d.teams = Array.isArray(d.teams) && d.teams.length ? d.teams : D.teams; d.turn = d.turn < d.teams.length ? d.turn || 0 : 0; d.used = d.used || {}; S = fix(d); save(); if (cur) closeClue(); init()
        } catch (x) {alert('That file is not a valid game file.')}
      }; r.readAsText(f)
    };
    // ---------- theme panel
    function themeUI() {
      const sel = $('#tp'); sel.innerHTML = '<option value="">Custom</option>' + Object.keys(P).map(k => `<option>${k}</option>`).join('');
      const tf = $('#tf'); tf.innerHTML = Object.keys(FONTS).map(k => `<option value="${FONTS[k]}">${k}</option>`).join('');
      document.querySelectorAll('[data-k]').forEach(i => {i.value = S.theme[i.dataset.k]; i.oninput = () => {S.theme[i.dataset.k] = i.type == 'range' ? +i.value : i.value; save(); applyTheme(); sel.value = ''}});
      sel.onchange = () => {if (!sel.value) return; S.theme = {...P[sel.value]}; save(); applyTheme(); document.querySelectorAll('[data-k]').forEach(i => i.value = S.theme[i.dataset.k])}
    }
    $('#bTheme').onclick = () => {themeUI(); $('#th').hidden = false}; $('#thX').onclick = () => $('#th').hidden = true;
    document.addEventListener('keydown', e => {
      if (!cur || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      if (e.key == 'Escape') closeClue(); else if (e.key == ' ' && cur.stage == 1 && !cur.rev) {e.preventDefault(); cur.rev = true; draw()}
    });
    function init() {applyTheme(); $('#title').textContent = S.title; document.title = S.title; board(true); scores()}
    init();
  </script>
</body>

</html>
